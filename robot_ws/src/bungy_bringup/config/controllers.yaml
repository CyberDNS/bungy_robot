/bungy/controller_manager:
  ros__parameters:
    update_rate: 30

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_cont:
      type: diff_drive_controller/DiffDriveController

/bungy/diff_cont:
  ros__parameters:
    publish_rate: 30.0
    base_frame_id: base_link
    odom_frame_id: odom
    enable_odom_tf: false  # Let EKF publish the odom->base_link transform instead
    
    left_wheel_names:  [left_wheel_joint]
    right_wheel_names: [right_wheel_joint]

    wheel_separation: 0.184
    wheel_radius: 0.06
    use_stamped_vel: false
    
    # Wheel calibration for drift compensation
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0
    
    # Velocity and acceleration limits
    linear:
      x:
        has_velocity_limits: true
        max_velocity: 1.0
        min_velocity: -1.0
        has_acceleration_limits: true
        max_acceleration: 2.0
        min_acceleration: -2.0
        has_jerk_limits: false
    
    angular:
      z:
        has_velocity_limits: true
        max_velocity: 3.0
        min_velocity: -3.0
        has_acceleration_limits: true
        max_acceleration: 5.0
        min_acceleration: -5.0
        has_jerk_limits: false
    
    # Command timeout and odom settings
    cmd_vel_timeout: 0.5
    publish_limited_velocity: true
    velocity_rolling_window_size: 10
    
    # Position feedback settings
    position_feedback: true
    open_loop: false