/bungy/controller_manager:
  ros__parameters:
    update_rate: 30

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_cont:
      type: diff_drive_controller/DiffDriveController

/bungy/diff_cont:
  ros__parameters:
    publish_rate: 30.0
    tf_frame_prefix_enable: false  # frames below are already fully qualified
    base_frame_id: bungy/base_link
    odom_frame_id: bungy/odom
    enable_odom_tf: false  # Let EKF publish the odom->base_link transform instead
    
    left_wheel_names:  [left_wheel_joint]
    right_wheel_names: [right_wheel_joint]

    # Calibration baseline for the position-feedback driver (2026-11-07): the old values
    # (separation 0.22, multipliers 0.981 / 1.0325) compensated the old open-loop servo errors.
    # Straight-line floor test 2026-11-07 (5 s at 0.2 m/s, 3 runs): odom 101.1-101.2 cm, tape 100.8-101.3 cm,
    # drift 0.5-3 cm, so radius 0.06 and multipliers 1.0 are correct. wheel_separation still to be calibrated.
    # Spin tests 2026-11-07 (IMU reference, 180 deg at 1.0 and 0.5 rad/s): real/odom = 1.026 / 1.024 with 0.19,
    # the same at both speeds -> 0.19 / 1.025 = 0.185.
    wheel_separation: 0.185
    wheel_radius: 0.06
    use_stamped_vel: true

    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    # Velocity and acceleration limits
    linear:
      x:
        has_velocity_limits: true
        max_velocity: 1.0
        min_velocity: -1.0
        has_acceleration_limits: true
        max_acceleration: 2.0
        min_acceleration: -2.0
        has_jerk_limits: false
    
    angular:
      z:
        has_velocity_limits: true
        max_velocity: 3.0
        min_velocity: -3.0
        has_acceleration_limits: true
        max_acceleration: 5.0
        min_acceleration: -5.0
        has_jerk_limits: false
    
    # Command timeout and odom settings
    cmd_vel_timeout: 0.5
    publish_limited_velocity: true
    velocity_rolling_window_size: 10
    
    # Position feedback settings
    position_feedback: true
    open_loop: false