/bungy/controller_manager:
  ros__parameters:
    update_rate: 30

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_cont:
      type: diff_drive_controller/DiffDriveController

/bungy/diff_cont:
  ros__parameters:
    publish_rate: 30.0
    tf_frame_prefix_enable: false  # frames below are already fully qualified
    base_frame_id: bungy/base_link
    odom_frame_id: bungy/odom
    enable_odom_tf: false  # Let EKF publish the odom->base_link transform instead
    
    left_wheel_names:  [left_wheel_joint]
    right_wheel_names: [right_wheel_joint]

    # Spin tests (2026-11-06, BNO055 IMU as reference, 1.0 rad/s commanded for 3.14 s):
    #   wheel_separation 0.2865 -> real 259.5 deg, 0.19 -> real 145.2 deg (180 commanded)
    # Interpolated to ~0.22 for an accurate half turn at 1.0 rad/s. This is an empirical
    # command gain, not the geometric spacing (~0.19 m): real turning depends on wheel speed
    # (slower turns under-rotate, faster ones over-rotate). The EKF takes yaw from the IMU.
    wheel_separation: 0.22
    wheel_radius: 0.06
    use_stamped_vel: true
    
    # Wheel calibration (floor test 2026-11-06: 40 cm commanded, 41.3 cm real,
    # robot curved left by 2.3 cm -> right wheel effectively larger than left)
    left_wheel_radius_multiplier: 0.981
    right_wheel_radius_multiplier: 1.0325
    
    # Velocity and acceleration limits
    linear:
      x:
        has_velocity_limits: true
        max_velocity: 1.0
        min_velocity: -1.0
        has_acceleration_limits: true
        max_acceleration: 2.0
        min_acceleration: -2.0
        has_jerk_limits: false
    
    angular:
      z:
        has_velocity_limits: true
        max_velocity: 3.0
        min_velocity: -3.0
        has_acceleration_limits: true
        max_acceleration: 5.0
        min_acceleration: -5.0
        has_jerk_limits: false
    
    # Command timeout and odom settings
    cmd_vel_timeout: 0.5
    publish_limited_velocity: true
    velocity_rolling_window_size: 10
    
    # Position feedback settings
    position_feedback: true
    open_loop: false