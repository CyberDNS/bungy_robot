# Nav2 parameters for the Bungy robot (Raspberry Pi 4, self-contained).
# Derived from the Jazzy stock nav2_params.yaml (MPPI -> Regulated Pure Pursuit, route/docking/smoother
# servers removed). Differences to the stock file:
#  - frames carry the bungy/ prefix (bungy/map, bungy/odom, bungy/base_link); odometry is the EKF output
#  - speeds: 0.2 m/s desired, 0.3 m/s limit (the wheels top out near 0.36 m/s); approach speed 0.05 m/s,
#    above the servos' 0.029 m/s minimum
#  - Pi load: controller 10 Hz, local costmap 5 Hz / global 1 Hz, AMCL 200-1000 particles
#  - the final command is collision_monitor's output on /cmd_vel_nav_safe, which is the twist_mux input
#    for navigation (config/twist_mux.yaml)
#  - robot_radius 0.17 m is estimated from the URDF body (0.25 x 0.15 m) and the wheels: measure the robot!
amcl:
  ros__parameters: {alpha1: 0.2, alpha2: 0.2, alpha3: 0.2, alpha4: 0.2, alpha5: 0.2,
    base_frame_id: bungy/base_link, beam_skip_distance: 0.5, beam_skip_error_threshold: 0.9,
    beam_skip_threshold: 0.3, do_beamskip: false, global_frame_id: bungy/map, lambda_short: 0.1,
    laser_likelihood_max_dist: 2.0, laser_max_range: 10.0, laser_min_range: -1.0,
    laser_model_type: likelihood_field, max_beams: 60, max_particles: 1000, min_particles: 200,
    odom_frame_id: bungy/odom, pf_err: 0.05, pf_z: 0.99, recovery_alpha_fast: 0.0,
    recovery_alpha_slow: 0.0, resample_interval: 1, robot_model_type: 'nav2_amcl::DifferentialMotionModel',
    save_pose_rate: 0.5, sigma_hit: 0.2, tf_broadcast: true, transform_tolerance: 1.0,
    update_min_a: 0.1, update_min_d: 0.1, z_hit: 0.5, z_max: 0.05, z_rand: 0.5, z_short: 0.05,
    scan_topic: /scan, set_initial_pose: true}
bt_navigator:
  ros__parameters:
    global_frame: bungy/map
    robot_base_frame: bungy/base_link
    odom_topic: /bungy/odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: [navigate_to_pose, navigate_through_poses]
    navigate_to_pose: {plugin: 'nav2_bt_navigator::NavigateToPoseNavigator'}
    navigate_through_poses: {plugin: 'nav2_bt_navigator::NavigateThroughPosesNavigator'}
    error_code_names: [compute_path_error_code, follow_path_error_code]
controller_server:
  ros__parameters:
    controller_frequency: 10.0
    costmap_update_timeout: 0.3
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    use_realtime_priority: false
    progress_checker: {plugin: 'nav2_controller::SimpleProgressChecker', required_movement_radius: 0.1,
      movement_time_allowance: 15.0}
    general_goal_checker: {stateful: true, plugin: 'nav2_controller::SimpleGoalChecker',
      xy_goal_tolerance: 0.15, yaw_goal_tolerance: 0.3}
    FollowPath: {plugin: 'nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController',
      desired_linear_vel: 0.2, lookahead_dist: 0.4, min_lookahead_dist: 0.25, max_lookahead_dist: 0.7,
      lookahead_time: 1.5, rotate_to_heading_angular_vel: 0.6, transform_tolerance: 0.2,
      use_velocity_scaled_lookahead_dist: false, min_approach_linear_velocity: 0.05,
      approach_velocity_scaling_dist: 0.6, use_collision_detection: true, max_allowed_time_to_collision_up_to_carrot: 1.0,
      use_regulated_linear_velocity_scaling: true, use_cost_regulated_linear_velocity_scaling: false,
      regulated_linear_scaling_min_radius: 0.5, regulated_linear_scaling_min_speed: 0.05,
      use_fixed_curvature_lookahead: false, use_rotate_to_heading: true, rotate_to_heading_min_angle: 0.5,
      max_angular_accel: 1.5, allow_reversing: false, max_robot_pose_search_dist: 1.0,
      interpolate_curvature_after_goal: false}
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: bungy/odom
      robot_base_frame: bungy/base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.17
      plugins: [obstacle_layer, inflation_layer]
      inflation_layer: {plugin: 'nav2_costmap_2d::InflationLayer', cost_scaling_factor: 3.0,
        inflation_radius: 0.45}
      static_layer: {plugin: 'nav2_costmap_2d::StaticLayer', map_subscribe_transient_local: true}
      always_send_full_costmap: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan: {topic: /scan, max_obstacle_height: 2.0, clearing: true, marking: true,
          data_type: LaserScan, raytrace_max_range: 3.0, raytrace_min_range: 0.0,
          obstacle_max_range: 2.5, obstacle_min_range: 0.0}
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: bungy/map
      robot_base_frame: bungy/base_link
      robot_radius: 0.17
      resolution: 0.05
      track_unknown_space: true
      plugins: [static_layer, obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan: {topic: /scan, max_obstacle_height: 2.0, clearing: true, marking: true,
          data_type: LaserScan, raytrace_max_range: 3.0, raytrace_min_range: 0.0,
          obstacle_max_range: 2.5, obstacle_min_range: 0.0}
      static_layer: {plugin: 'nav2_costmap_2d::StaticLayer', map_subscribe_transient_local: true}
      inflation_layer: {plugin: 'nav2_costmap_2d::InflationLayer', cost_scaling_factor: 3.0,
        inflation_radius: 0.45}
      always_send_full_costmap: true
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: [GridBased]
    costmap_update_timeout: 1.0
    GridBased: {plugin: 'nav2_navfn_planner::NavfnPlanner', tolerance: 0.5, use_astar: false,
      allow_unknown: true}
behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, assisted_teleop, wait]
    spin: {plugin: 'nav2_behaviors::Spin'}
    backup: {plugin: 'nav2_behaviors::BackUp'}
    drive_on_heading: {plugin: 'nav2_behaviors::DriveOnHeading'}
    wait: {plugin: 'nav2_behaviors::Wait'}
    assisted_teleop: {plugin: 'nav2_behaviors::AssistedTeleop'}
    local_frame: bungy/odom
    global_frame: bungy/map
    robot_base_frame: bungy/base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 1.5
waypoint_follower:
  ros__parameters:
    loop_rate: 10
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint: {plugin: 'nav2_waypoint_follower::WaitAtWaypoint', enabled: true,
      waypoint_pause_duration: 200}
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: false
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.3, 0.0, 1.0]
    min_velocity: [-0.15, 0.0, -1.0]
    max_accel: [0.5, 0.0, 1.5]
    max_decel: [-1.0, 0.0, -2.0]
    odom_topic: /bungy/odometry/filtered
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
collision_monitor:
  ros__parameters:
    base_frame_id: bungy/base_link
    odom_frame_id: bungy/odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel_nav_safe
    state_topic: collision_monitor_state
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: [FootprintApproach]
    FootprintApproach: {type: polygon, action_type: approach, footprint_topic: /local_costmap/published_footprint,
      time_before_collision: 1.2, simulation_time_step: 0.1, min_points: 6, visualize: false,
      enabled: true}
    observation_sources: [scan]
    scan: {type: scan, topic: /scan, min_height: 0.15, max_height: 2.0, enabled: true}
