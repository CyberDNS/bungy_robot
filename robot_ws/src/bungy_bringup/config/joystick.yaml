joy_node:
  ros__parameters:
    device_id: 0
    deadzone: 0.1  # Increased from 0.05 to reduce drift from stick noise
    autorepeat_rate: 20.0


teleop_node:
  ros__parameters:
    
    axis_linear:  # Left thumb stick vertical
      x: 1
    scale_linear:
      x: 0.3  # Reduced from 0.5 for finer control

    axis_angular:  # Left thumb stick horizontal
      yaw: 0
    scale_angular:
      yaw: 1.5  # Reduced from 2.0 for finer turning control

    # Drive directly with the left stick: no enable (dead-man) button and no turbo.
    # (Full stick = 0.3 m/s; the wheels top out near 0.36 m/s, so turbo had no use.)
    require_enable_button: false
    enable_turbo_button: -1